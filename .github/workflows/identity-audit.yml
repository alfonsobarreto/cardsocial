# Fase D — re-chequeo de identidad + tipos (app Expo / monorepo raíz)
name: Identity audit and TypeScript

# PR: cualquier rama base. Push: sólo main/develop (evita duplicar en cada feature branch).
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: identity-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies (repo root)
        run: npm ci

      - name: Phase D — identity anti-patterns
        run: npm run audit:identity

      - name: TypeScript (app / services)
        run: npx tsc --noEmit
