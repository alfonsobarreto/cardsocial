# CI (audit + tsc) y CD (build Next + despliegue a Azure) en un solo "workflow run" por push.
# Antes: identity-audit.yml y este archivo se disparaban los dos a la vez en cada push a main.
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - card-social-api

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: card-social-api-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Antes lives en identity-audit.yml; corre en PRs y antes del build al hacer push.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies (repo root)
        run: npm ci

      - name: Phase D — identity anti-patterns
        run: npm run audit:identity

      - name: Core locales (i18n audit)
        run: npm run audit:locales

      - name: TypeScript (app / services)
        run: npx tsc --noEmit

      - name: TypeScript + ESLint (frontend-web / Studio)
        run: |
          set -e
          cd frontend-web
          npm ci
          npx tsc --noEmit
          npm run lint

  build:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        run: npm ci --omit=dev
        working-directory: backend

      - name: Install frontend-web dependencies
        run: npm ci
        working-directory: frontend-web

      - name: Build frontend-web (Next.js)
        run: npm run build
        working-directory: frontend-web
        env:
          NEXT_PUBLIC_API_URL: https://cardsocial.me
          # Subida de perfil / documentos en Studio (misma clave que el gateway del backend, como en Expo).
          NEXT_PUBLIC_MODERATION_GATEWAY_KEY: ${{ secrets.NEXT_PUBLIC_MODERATION_GATEWAY_KEY }}

      - name: Copy Next.js standalone into backend
        run: |
          set -euo pipefail
          test -f frontend-web/.next/standalone/server.js
          rm -rf backend/frontend-web
          mkdir -p backend/frontend-web
          cp -a frontend-web/.next/standalone/. backend/frontend-web/
          mkdir -p backend/frontend-web/.next/static
          cp -a frontend-web/.next/static/. backend/frontend-web/.next/static/
          if [ -d frontend-web/public ]; then
            mkdir -p backend/frontend-web/public
            cp -a frontend-web/public/. backend/frontend-web/public/ || true
          fi
          test -f backend/frontend-web/server.js
          test -f backend/frontend-web/.next/BUILD_ID
          echo "Next bundle OK:" && ls -la backend/frontend-web/.next | head -24

      - name: Copy shared i18n JSON into backend bundle (Azure wwwroot has no monorepo `services/`)
        run: |
          set -euo pipefail
          mkdir -p backend/i18n
          cp services/i18n/emailLocales.json backend/i18n/
          cp services/i18n/machineErrorQrNfc.json backend/i18n/
          cp services/i18n/machineSuccessQrNfc.json backend/i18n/
          test -f backend/i18n/emailLocales.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_435D338FC0714FD7BD966C9D17B323AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B9A6910AA7914E2794717080DEEACBC6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DA640B2952694765A161B35BFCC83C46 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'card-social-api'
          slot-name: 'Production'
          package: .
