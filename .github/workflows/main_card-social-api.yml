# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - card-social-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install backend dependencies
        run: npm ci --omit=dev
        working-directory: backend

      - name: Install frontend-web dependencies
        run: npm ci
        working-directory: frontend-web

      - name: Build frontend-web (Next.js)
        run: npm run build
        working-directory: frontend-web
        env:
          NEXT_PUBLIC_API_URL: https://cardsocial.me

      # Next output:standalone incluye server.js + .next/ mínimo. Hay que copiar .next/static y public aparte.
      # upload-artifact@v4 excluye rutas ocultas por defecto → sin include-hidden-files la carpeta .next NO sube a Azure.
      - name: Copy Next.js standalone into backend
        run: |
          set -euo pipefail
          test -f frontend-web/.next/standalone/server.js
          rm -rf backend/frontend-web
          mkdir -p backend/frontend-web
          cp -a frontend-web/.next/standalone/. backend/frontend-web/
          mkdir -p backend/frontend-web/.next/static
          cp -a frontend-web/.next/static/. backend/frontend-web/.next/static/
          if [ -d frontend-web/public ]; then
            mkdir -p backend/frontend-web/public
            cp -a frontend-web/public/. backend/frontend-web/public/ || true
          fi
          test -f backend/frontend-web/server.js
          test -f backend/frontend-web/.next/BUILD_ID
          echo "Next bundle OK:" && ls -la backend/frontend-web/.next | head -24

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_435D338FC0714FD7BD966C9D17B323AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B9A6910AA7914E2794717080DEEACBC6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DA640B2952694765A161B35BFCC83C46 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'card-social-api'
          slot-name: 'Production'
          package: .
