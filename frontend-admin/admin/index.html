<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card-Social Admin Login</title>
    <style>
      :root {
        --navy: #0a2540;
        --gold: #c5a065;
        --bg: #f8f9fa;
        --text: #1f2937;
        --danger: #b42318;
        --success: #067647;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at 20% 10%, #ffffff 0%, var(--bg) 70%);
        color: var(--text);
        display: grid;
        place-items: center;
      }
      .card {
        width: min(420px, 92vw);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(10, 37, 64, 0.16);
        border: 1px solid rgba(10, 37, 64, 0.1);
        overflow: hidden;
      }
      .head {
        background: linear-gradient(135deg, var(--navy), #123e6a);
        color: #fff;
        padding: 22px;
      }
      .head h1 { margin: 0; font-size: 1.2rem; }
      .head p { margin: 6px 0 0; opacity: .9; font-size: .9rem; }
      form { padding: 22px; display: grid; gap: 14px; }
      label { font-size: .9rem; font-weight: 600; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: .95rem;
      }
      input:focus { outline: 2px solid rgba(197,160,101,.4); border-color: var(--gold); }
      button {
        margin-top: 6px;
        border: none;
        border-radius: 999px;
        padding: 12px 16px;
        background: var(--gold);
        color: #111827;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { opacity: .6; cursor: not-allowed; }
      .msg { padding: 10px 12px; border-radius: 10px; font-size: .9rem; display: none; }
      .msg.show { display: block; }
      .msg.error { background: #fee4e2; color: var(--danger); }
      .msg.ok { background: #dcfae6; color: var(--success); }
      .foot { padding: 0 22px 18px; color: #475467; font-size: .8rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <h1>Card-Social Admin</h1>
        <p>Acceso seguro al panel de gestión</p>
      </div>
      <form id="loginForm">
        <div>
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" placeholder="admin_pochobs" required />
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>
        <div id="msg" class="msg"></div>
        <button id="submitBtn" type="submit">Iniciar Sesión</button>
      </form>
      <div class="foot">JWT Session: 30 minutos</div>
    </div>

    <script>
      const API = "https://api.cardsocial.me/api/admin/login";
      const form = document.getElementById("loginForm");
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submitBtn");

      function showMessage(type, text) {
        msg.className = `msg show ${type}`;
        msg.textContent = text;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Validando...";
        msg.className = "msg";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          if (!res.ok) {
            let err = "Credenciales inválidas";
            try {
              const body = await res.json();
              if (body && body.error) err = body.error;
            } catch (_) {}
            throw new Error(err);
          }

          const data = await res.json();
          localStorage.setItem("admin_token", data.token);
          showMessage("ok", "Login exitoso. Token guardado en navegador.");
        } catch (error) {
          showMessage("error", "Error de login: " + error.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Iniciar Sesión";
        }
      });
    </script>
  </body>
</html>
